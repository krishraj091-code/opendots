services:
  - type: web
    name: opendots
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CPK_INTELLIGENCE_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: COMPOSIO_API_KEY
        sync: false
      - key: WEB_SEARCH_PROVIDER
        value: parallel
