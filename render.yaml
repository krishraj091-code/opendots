services:
  - type: web
    name: opendots
    env: docker
    plan: free
    dockerfilePath: Dockerfile
    dockerTarget: app
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: OWNER_TOKEN
        value: opendots_owner_secure_token_32chars
      - key: BROWSER_SECRET
        value: opendots_browser_secret_key_32chars
      - key: OPENAI_MODEL
        value: deepseek/deepseek-chat
      - key: APP_ORIGIN
        value: https://opendots.skshm.online,https://opendots-1.onrender.com
      - key: CPK_INTELLIGENCE_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: COMPOSIO_API_KEY
        sync: false
      - key: WEB_SEARCH_PROVIDER
        value: parallel
